# Shared by every package (included from each analysis_options.yaml next to its own lint set).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A future dropped on the floor hides failures (saves, deletes, downloads).
    unawaited_futures: error
    discarded_futures: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    # Two string literals in a row inside a list are one element. A missing comma
    # between list items looks the same, so concatenation has to be written with '+'.
    - no_adjacent_strings_in_list
    - prefer_final_locals
    - prefer_final_in_for_each
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_statements
    - use_named_constants
