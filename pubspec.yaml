# Pub workspace: one resolution (pubspec.lock) for the app and all packages.
name: refocal_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/refocal_core
  - packages/refocal_ffi
  - packages/refocal_platform

# package:sqlite3 compiles the vendored amalgamation instead of downloading prebuilt libraries:
# everything in the APK is built from source (COMP-FDR-001, ADR-0009).
hooks:
  user_defines:
    sqlite3:
      source: source
      path: native/third_party/sqlite/sqlite3.c
