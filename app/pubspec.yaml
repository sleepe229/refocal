name: refocal
description: "Refocal: on-device AI photo enhancer."
publish_to: none
version: 0.0.1-alpha.1+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  refocal_core: any
  refocal_ffi: any
  refocal_platform: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Filled by tools/models/fetch.sh (weights are not in git); empty in CI builds.
    - assets/models/sr.general-x4v3/
    - assets/licenses/
