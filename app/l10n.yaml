# gen-l10n: en is the template (FR-SET-006). Other languages come from Weblate (NFR-L10N-005,
# docs/ops/weblate.md): only the .arb files are in git, the Dart output is generated by
# `flutter pub get` and every build (pubspec `generate: true`) and formatted for the CI check.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
format: true
