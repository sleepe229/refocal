# dart run ffigen — regenerate lib/src/enh_bindings.g.dart after changing native/include/enh.h
name: EnhBindings
description: Bindings for the Refocal native core (native/include/enh.h).
output: lib/src/enh_bindings.g.dart
headers:
  entry-points:
    - ../../native/include/enh.h
  include-directives:
    - ../../native/include/enh.h
functions:
  include:
    - enh_.*
  leaf:
    include:
      - enh_abi_version
      - enh_version
      - enh_free
      - enh_job_cancel
      - enh_job_pause
      - enh_job_status
      - enh_look_matrix
      - enh_set_.*
macros:
  include:
    - ENH_.*
typedefs:
  include:
    - enh_.*
preamble: |
  // Generated by ffigen from native/include/enh.h. Do not edit.
  // ignore_for_file: type=lint, unused_field
