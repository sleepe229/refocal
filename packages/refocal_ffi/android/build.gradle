// refocal_ffi: builds native/ (libenh.so + ncnn) with the NDK through AGP.
group = "io.github.refocal.refocal_ffi"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "io.github.refocal.refocal_ffi"
    compileSdk = 36
    ndkVersion = android.ndkVersion // from the app (pinned there)

    externalNativeBuild {
        cmake {
            path = "../../../native/CMakeLists.txt"
            version = "3.31.6" // pinned: SDK package cmake;3.31.6
        }
    }
    defaultConfig {
        minSdk = 29
        // Q-03: x86_64 only for emulator builds. -PrefocalAbis=arm64-v8a (or the env var
        // ORG_GRADLE_PROJECT_refocalAbis) skips it, e.g. in CI.
        ndk { abiFilters(*((project.findProperty("refocalAbis") ?: "arm64-v8a,x86_64").toString().split(","))) }
        externalNativeBuild {
            cmake {
                // -PrefocalCcache=ccache (CI): compiler launcher for the native build. Never set
                // for releases, so it cannot affect reproducibility (S8).
                def launcher = project.findProperty("refocalCcache")
                arguments(*(["-DANDROID_STL=c++_static", "-DENH_VULKAN=ON"] +
                    (launcher ? ["-DCMAKE_C_COMPILER_LAUNCHER=${launcher}",
                                 "-DCMAKE_CXX_COMPILER_LAUNCHER=${launcher}"] : [])))
                targets "enh"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
