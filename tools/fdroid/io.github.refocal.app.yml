# Copy of metadata/io.github.refocal.app.yml in fdroiddata (COMP-FDR-*), merge request
# https://gitlab.com/fdroid/fdroiddata/-/merge_requests/52962. Kept here so it changes with the
# build; update the merge request together with it.
#
# Reproducible build (COMP-FDR-004, S8): F-Droid builds the tag and compares with the APK from
# GitHub Releases (Binaries); if equal, it publishes our signed APK. Flutter is the repo's own
# submodule (pinned, S8). Open points for S8b, to settle in the merge request review:
# - bundled model weights (sr.general-x4v3 BSD-3, YuNet MIT) are not in git; prebuild fetches
#   them from our GitHub releases and checks the SHA-256 pins in tools/models/models.lock;
# - the server builds in /home/vagrant/build/io.github.refocal.app; release.yml builds at the same
#   path, because clang's OpenMP source locations in ncnn keep absolute paths (S8b finding).
Categories:
  - Graphics
  - Multimedia
License: Apache-2.0
AuthorName: Refocal contributors
SourceCode: https://github.com/sleepe229/refocal
IssueTracker: https://github.com/sleepe229/refocal/issues
Changelog: https://github.com/sleepe229/refocal/blob/HEAD/CHANGELOG.md

AutoName: Refocal

RepoType: git
Repo: https://github.com/sleepe229/refocal.git
Binaries: 
  https://github.com/sleepe229/refocal/releases/download/v%v/refocal-v%v-arm64-v8a.apk

Builds:
  - versionName: 0.5.0-beta.2
    versionCode: 9
    commit: 9493f162c5f39ee8ea05d06ec99a99fe18689720
    subdir: app
    submodules: true
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    prebuild: ../tools/models/fetch.sh
    scanignore:
      - flutter/packages/flutter_tools/gradle
      - flutter/engine
      - app/assets/models
    scandelete:
      - flutter/dev
      - native/tests/fuzz/corpus
      - native/third_party/ncnn/examples
      - native/third_party/libwebp/build.gradle
      - native/third_party/libwebp/swig/libwebp.jar
    build:
      - export PATH="$PWD/../flutter/bin:$PATH"
      - flutter config --no-analytics
      - flutter build apk --release --flavor fdroid --target-platform android-arm64
        --split-debug-info=build/symbols
    ndk: 28.2.13676358

AllowedAPKSigningKeys: 6574411b1c52eddc4255da82d4af122840e377207931ddc75d0d4485cca4c7d8

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+(-[a-z]+\.[0-9]+)?$
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.5.0-beta.2
CurrentVersionCode: 9
