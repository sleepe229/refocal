# DCO (OPS-GOV-001): every commit of a pull request carries "Signed-off-by:" matching its author
# (`git commit -s`). Merge commits and bots are exempt. Runs for every PR, docs included.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qiF "Signed-off-by: $(git log -1 --format='%an <%ae>' "$c")"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by for $(git log -1 --format='%an <%ae>' "$c")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Sign off with 'git commit -s'; fix existing commits with 'git rebase --signoff $BASE'. See CONTRIBUTING.md."
          fi
          exit "$bad"
