# Nightly (docs/spec/11-ci-cd-release.md §1). Fuzzing 1 h (30 min per target) on the corpus the
# PR runs grew; Beta gate (10 §5): 1 h without findings. Faces end to end with the real face
# packs (GFPGAN 177 MB, CodeFormer 190 MB: too large for every PR). Patrol on emulators, NR-IQA/ArcFace and device-farm
# perf join with their tooling.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Known vulnerabilities in dependencies (SEC-INP-006), tools/osv/check.sh.
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: osv-scanner v2.6.0 (pinned by SHA-256)
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /tmp/osv-scanner" | sha256sum -c
          chmod +x /tmp/osv-scanner
      - run: tools/osv/check.sh /tmp/osv-scanner

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # 11 §1: an hour of fuzzing a night, shared by the targets (4 x 15 min: metaio, decode,
      # zip, heif), within the job's 90 min with the build.
      - name: Fuzz 15 min per target
        run: tools/fuzz/run.sh 900
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: native/build-fuzz/findings

  faces:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - run: sudo apt-get install -y --no-install-recommends libomp-18-dev python3-jsonschema >/dev/null
      - name: Bundled models and the face pack, verified against the manifest
        run: |
          DEST=native/build-ci/golden tools/models/fetch.sh
          python3 tools/models/fetch_pack.py face.gfpgan-1.4 native/build-ci/golden
          python3 tools/models/fetch_pack.py face.codeformer native/build-ci/golden
          # Golden pair of the CodeFormer split graph (ADR-0024), written by convert_codeformer.py.
          mkdir -p native/build-ci/golden/face.codeformer-golden
          gh release download model-face.codeformer-v1 --pattern '*_3x512x512.f32' \
            --dir native/build-ci/golden/face.codeformer-golden
      - name: Build and run test_faces
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S native -B native/build-ci -DENH_BUILD_TESTS=ON \
            -DENH_NCNN_RUNTIME_CPU=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build native/build-ci -j"$(nproc)" --target test_faces
          ctest --test-dir native/build-ci -R faces --output-on-failure
