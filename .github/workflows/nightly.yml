# Nightly (docs/spec/11-ci-cd-release.md §1). Fuzzing 1 h (30 min per target) on the corpus the
# PR runs grew; Beta gate (10 §5): 1 h without findings. Patrol on emulators, NR-IQA/ArcFace and
# device-farm perf join with their tooling.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz 30 min per target
        run: tools/fuzz/run.sh 1800
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: native/build-fuzz/findings
