# Publishes the project site to GitHub Pages (https://sleepe229.github.io/refocal/): the store
# description as the landing page and PRIVACY.md as /privacy, which the app links to from
# About (FR-SET-008, 07 §7). Built by tools/site/build.py.
name: site

on:
  push:
    branches: [main]
    paths: [PRIVACY.md, fastlane/metadata/android/en-US/**, tools/site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends python3-markdown >/dev/null
      - run: tools/site/build.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
