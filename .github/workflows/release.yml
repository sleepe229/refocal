# Release (docs/spec/11-ci-cd-release.md, OPS-REL-001/002): on a tag v*, build the fdroid flavor in
# the pinned rebuilder image, sign it with the release key (Gradle signingConfig: the only way the
# signature survives apksigcopier, S8), and publish a DRAFT GitHub release with SHA256SUMS, an
# SPDX SBOM (tools/sbom/make_sbom.py) and provenance and SBOM attestations. A maintainer reviews and publishes the draft by hand.
#
# Secrets (Environment "release", required reviewer): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See docs/ops/release.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write       # draft release
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive
      - name: Version check (tag == pubspec, the only copy of the version)
        run: |
          tag=${GITHUB_REF_NAME#v}
          pub=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          echo "tag=$tag pubspec=$pub"
          [ "$tag" = "$pub" ]
      - name: Bundled model (verified against tools/models/models.lock)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/models/fetch.sh
      - name: Rebuilder image
        run: docker build -t refocal-rebuilder:release --build-arg UID=$(id -u) --build-arg GID=$(id -g) tools/rebuilder
      - name: Build and sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KS_B64" | base64 -d > app/android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/android/key.properties
          # arm64 only (Q-03): x86_64 would be compiled and then stripped from the release APK.
          docker run --rm -v "$PWD:/src" -e ORG_GRADLE_PROJECT_refocalAbis=arm64-v8a \
            -w /src/app refocal-rebuilder:release bash -euc '
            export PATH=/src/flutter/bin:$PATH
            git config --global --add safe.directory "*"
            flutter --suppress-analytics config --no-analytics >/dev/null
            flutter --suppress-analytics build apk --release --flavor fdroid --target-platform android-arm64 \
              --split-debug-info=build/symbols'
          rm -f app/android/release.jks app/android/key.properties
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-fdroid-release.apk "dist/refocal-${GITHUB_REF_NAME}-arm64-v8a.apk"
          # Dart symbols for `flutter symbolize` of stack traces from this release.
          tar -C app/build/symbols -czf "dist/refocal-${GITHUB_REF_NAME}-symbols.tar.gz" .
      - name: Verify signature and size
        run: |
          docker run --rm -v "$PWD/dist:/d" refocal-rebuilder:release bash -c \
            'apksigner verify --print-certs /d/*.apk && zipalign -c -P 16 4 /d/*.apk'
          size=$(stat -c %s dist/*.apk)
          echo "APK size: $size bytes"
          [ "$size" -le 31457280 ] || { echo "::error::APK over 30 MB (0.1 budget)"; exit 1; }
      - name: SBOM (OPS-REL-002)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/app refocal-rebuilder:release bash -euc '
            git config --global --add safe.directory "*"
            /src/flutter/bin/flutter --suppress-analytics config --no-analytics >/dev/null
            /src/flutter/bin/flutter --suppress-analytics pub deps --json' > deps.json
          tools/sbom/make_sbom.py "${GITHUB_REF_NAME#v}" deps.json "dist/refocal-${GITHUB_REF_NAME}.spdx.json"
      - name: SHA256SUMS
        run: cd dist && sha256sum *.apk *.tar.gz *.spdx.json > SHA256SUMS && cat SHA256SUMS
      # Not available for user-owned private repositories; runs once the repo is public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.apk
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.apk
          sbom-path: dist/refocal-${{ github.ref_name }}.spdx.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft $pre --title "Refocal ${GITHUB_REF_NAME}" \
            --notes "$notes" dist/*.apk dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS
