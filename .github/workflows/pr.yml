# PR gate (docs/spec/11-ci-cd-release.md §1, OPS-CI-001). M0 skeleton scope:
# Dart format/analyze/tests, ABI header sync, native tests with sanitizers (incl. TSan with a
# self-check), Android APK builds (play, fdroid) in the same pinned image as the S8 rebuilder.
# Native: test_abi, test_pipeline, test_job (end-to-end job ABI on synthetic ncnn models:
# exact nearest x4, tiled == whole, cancel, pause/resume, NEEDS_USER, fallback ladder, PNG
# input, export metadata), test_codecs (PNG/WebP, metaio EXIF rewrite + mutation fuzz).
# clang-format check; libFuzzer targets 5 min (fuzz job, 1 h in nightly.yml).
# Golden on the real model (TEST-ML-001, test_golden: ncnn CPU vs PyTorch fp32).
# clang-tidy (native job). TODO(0.1): license check, size gate,
# iOS build without signing (needs enh.xcframework, see packages/refocal_ffi/ios).
name: pr

# No paths filter here: "ci-ok" is the required check of main and must report on every PR,
# docs included. The "changes" job decides what runs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed: native jobs (3 ncnn builds) run only when the core can be affected.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.f.outputs.native }}
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            { echo "native=true"; echo "code=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          # Anything but docs: the app, scripts and workflows are checked.
          if echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(native/|spikes/s6-ffi/|tools/refocal-cli/|tools/fuzz/|tools/models/|\.clang-format|\.github/workflows/pr\.yml|\.gitmodules)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # Scripts and workflows: shellcheck, ruff (lint + format, ruff.toml), actionlint.
  scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install --user --quiet ruff==0.14.0 shellcheck-py==0.11.0.1 actionlint-py==1.7.8.24
      - name: shellcheck
        run: git ls-files '*.sh' | grep -v '^native/third_party/' | xargs ~/.local/bin/shellcheck
      - name: ruff
        run: ~/.local/bin/ruff check . && ~/.local/bin/ruff format --check .
      - name: actionlint
        run: PATH="$HOME/.local/bin:$PATH" actionlint
      - name: golden set sources (ml/golden/SOURCES.md from golden.lock)
        run: python3 tools/ml/golden_fetch.py --check-sources

  dart:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter SDK (pinned submodule, full history for versioning)
        id: flutter
        run: echo "sha=$(git rev-parse HEAD:flutter)" >> "$GITHUB_OUTPUT"
      # The submodule's git dir and the pub cache are restored before checkout; flutter/ itself
      # is a submodule worktree (its .git points into .git/modules) and must not be cached whole.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .git/modules/flutter
            ~/.pub-cache
          key: flutter-git-${{ steps.flutter.outputs.sha }}-${{ hashFiles('pubspec.lock') }}
      - run: |
          git submodule update --init flutter
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flutter/bin/cache
          key: flutter-bin-${{ steps.flutter.outputs.sha }}
      - run: flutter --suppress-analytics config --no-analytics && flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed app packages
      - name: Analyze
        run: flutter analyze app packages
      - name: enh.h in sync with the spec appendix
        run: diff -u docs/spec/appendix/enh.h native/include/enh.h
      - name: FFI bindings up to date
        run: |
          sudo apt-get install -y --no-install-recommends libclang-18-dev >/dev/null
          cd packages/refocal_ffi
          LIBCLANG_PATH=/usr/lib/llvm-18/lib dart run ffigen --config ffigen.yaml
          git diff --exit-code -- lib/src/enh_bindings.g.dart
      # Generated code is committed (ADR-0009, ADR-0005): regenerating must change nothing,
      # else a table, a schema dump or a Pigeon message was edited without its generated part.
      - name: drift code and schema dumps up to date
        run: |
          cd packages/refocal_core
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev make-migrations
          dart format .
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)"
      - name: Pigeon bindings up to date
        run: |
          cd packages/refocal_platform
          dart run pigeon --input pigeons/messages.dart
          dart format lib
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)"
      - name: refocal_core tests
        run: cd packages/refocal_core && dart test
      - name: app widget tests
        run: cd app && flutter test
      - name: SBOM builds (release.yml, OPS-REL-002)
        run: |
          git submodule update --init --depth 1 native/third_party/ncnn
          (cd app && flutter --suppress-analytics pub deps --json) > "$RUNNER_TEMP/deps.json"
          tools/sbom/make_sbom.py 0.0.0 "$RUNNER_TEMP/deps.json" "$RUNNER_TEMP/sbom.spdx.json"

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["", address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - name: OpenMP for clang (otherwise ncnn CPU inference is single-threaded), ccache
        run: sudo apt-get install -y --no-install-recommends libomp-18-dev ccache >/dev/null
      - name: ccache key (submodule commits)
        id: subs
        run: echo "sha=$(git submodule status --recursive native/third_party | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.sanitize }}-${{ steps.subs.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.sanitize }}-${{ steps.subs.outputs.sha }}-
            ccache-${{ matrix.sanitize }}-
      - name: TSan self-check (a known race must be reported)
        if: matrix.sanitize == 'thread'
        run: |
          # The two increments race with both threads alive (relaxed atomics give TSan no
          # happens-before). On the ubuntu-24.04 runners (kernel 6.17, clang 18) TSan reports
          # it in ~85% of runs (17/20 measured; same with clang 19/20 and mmap_rnd_bits=28),
          # so the check retries: it is here to catch a TSan that is silently off (S6).
          cat > race.cpp <<'EOF'
          #include <atomic>
          #include <thread>
          int x;
          std::atomic<int> step{0};
          int main() {
            std::thread t([] {
              x++;
              step.store(1, std::memory_order_relaxed);
              while (step.load(std::memory_order_relaxed) != 2) {}
            });
            while (step.load(std::memory_order_relaxed) != 1) {}
            x++;
            step.store(2, std::memory_order_relaxed);
            t.join();
          }
          EOF
          clang++-18 -fsanitize=thread -g race.cpp -o race
          for n in 1 2 3 4 5; do
            if ! ./race 2>race.err && grep -q "data race" race.err; then
              echo "TSan reported the race (attempt $n)"; exit 0
            fi
          done
          echo "::error::TSan does not detect races on this runner (kernel $(uname -r))"
          cat race.err
          exit 1
      - name: clang-format (.clang-format)
        if: matrix.sanitize == ''
        run: |
          pip install --user --quiet clang-format==18.1.8
          git ls-files 'native/core/*.cpp' 'native/core/*.hpp' 'native/include/*.h' \
            'native/tests/*.cpp' 'native/tests/*.hpp' 'tools/refocal-cli/*.cpp' \
            | xargs ~/.local/bin/clang-format --dry-run --Werror
      # TEST-ML-001: the real weights (the bundled model and the RRDBNet packs) and their PyTorch
      # fp32 references (GitHub release assets). The sanitizer builds skip the golden test.
      - name: Golden weights and references
        if: matrix.sanitize == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEST=native/build-ci/golden tools/models/fetch.sh
          LOCK=tools/models/golden.lock DEST=native/build-ci/golden tools/models/fetch.sh
          python3 tools/models/fetch_pack.py sr.x4plus native/build-ci/golden
          python3 tools/models/fetch_pack.py sr.x4plus-anime6b native/build-ci/golden
      - name: Configure
        run: >
          CC=clang-18 CXX=clang++-18 cmake -S native -B native/build-ci -G "Unix Makefiles"
          -DENH_BUILD_TESTS=ON -DENH_BUILD_CLI=ON -DENH_SANITIZE=${{ matrix.sanitize }} -DENH_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DENH_NCNN_RUNTIME_CPU=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build native/build-ci -j"$(nproc)"
      - name: clang-tidy (native/.clang-tidy)
        if: matrix.sanitize == ''
        run: |
          sudo apt-get install -y --no-install-recommends clang-tidy-18 >/dev/null
          git ls-files 'native/core/src/*.cpp' 'native/tests/*.cpp' 'tools/refocal-cli/*.cpp' \
            | xargs run-clang-tidy-18 -p native/build-ci -j "$(nproc)" -quiet -warnings-as-errors='*'
      - run: ctest --test-dir native/build-ci --output-on-failure
      - name: S6 event-bridge stress
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S spikes/s6-ffi/native -B spikes/s6-ffi/native/build-ci \
            -DSANITIZE=${{ matrix.sanitize }} -DDART_SDK_INCLUDE=/nonexistent \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache >/dev/null
          cmake --build spikes/s6-ffi/native/build-ci -j"$(nproc)"
          spikes/s6-ffi/native/build-ci/stress 1000


  # libFuzzer on the decoders and metaio (11 §1: 5 min per PR). The corpus grows across runs.
  fuzz:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/build-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz 150 s per target
        run: tools/fuzz/run.sh 150
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: native/build-fuzz/findings

  android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive
      - name: Bundled model (optional until the weights release exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/models/fetch.sh || echo "::warning::model not bundled, the APK will report it missing"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/rebuilder
          tags: refocal-rebuilder:ci
          load: true
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-ci
          key: gradle-${{ hashFiles('app/android/**/*.kts', 'packages/*/android/build.gradle*', 'app/android/gradle/wrapper/*') }}
          restore-keys: gradle-
      # ccache for the NDK build of the native core: 491 compilations, warm build ~1 min instead
      # of ~15 (measured on 4 CPUs). Keyed by submodule commits; each run saves a fresh entry.
      - name: ccache key (submodule commits)
        id: subs
        run: echo "sha=$(git submodule status --recursive native/third_party | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache-android
          key: ccache-android-${{ steps.subs.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ steps.subs.outputs.sha }}-
            ccache-android-
      - name: Build APKs (fdroid; play too on main; arm64 only in CI)
        env:
          FLAVORS: ${{ github.event_name == 'push' && 'fdroid play' || 'fdroid' }}
        run: |
          chmod -R a+rwX .
          mkdir -p ~/.gradle-ci ~/.ccache-android && chmod a+rwX ~/.gradle-ci ~/.ccache-android
          for flavor in $FLAVORS; do
            docker run --rm -v "$PWD:/src" \
              -v "$HOME/.gradle-ci:/gradle" -e GRADLE_USER_HOME=/gradle \
              -v "$HOME/.ccache-android:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src \
              -e CCACHE_NOHASHDIR=true -e CCACHE_MAXSIZE=1G \
              -e ORG_GRADLE_PROJECT_refocalAbis=arm64-v8a -e ORG_GRADLE_PROJECT_refocalCcache=ccache \
              -w /src/app refocal-rebuilder:ci bash -euc "
              export PATH=/src/flutter/bin:\$PATH
              git config --global --add safe.directory '*'
              flutter --suppress-analytics config --no-analytics >/dev/null
              flutter --suppress-analytics build apk --release --flavor $flavor --target-platform android-arm64 \
                --split-debug-info=build/symbols
              ccache -s | grep -iE 'hits|misses' | head -2"
          done
          ls -l app/build/app/outputs/flutter-apk/
      # COMP-FDR-001/007, COMP-AND-012: no Google Play services or Firebase in the fdroid APK,
      # neither in the merged manifest (e.g. Photo Picker backport ModuleDependencies) nor in dex.
      - name: No GMS/Firebase in the fdroid APK
        run: |
          docker run --rm -v "$PWD/app/build/app/outputs/flutter-apk:/a" refocal-rebuilder:ci bash -euc '
            /opt/android-sdk/build-tools/36.0.0/aapt2 dump xmltree --file AndroidManifest.xml \
              /a/app-fdroid-release.apk > /tmp/manifest.txt
            cd /tmp && unzip -qo /a/app-fdroid-release.apk "classes*.dex"
            if grep -iE "com\.google\.android\.gms|com\.google\.firebase" /tmp/manifest.txt; then
              echo "::error::GMS/Firebase in the merged manifest"; exit 1; fi
            if grep -lE "Lcom/google/android/gms/|Lcom/google/firebase/" /tmp/classes*.dex; then
              echo "::error::GMS/Firebase classes in dex"; exit 1; fi
            echo "clean"'
      - name: Native libraries hardened (SEC-INP-003)
        run: python3 tools/security/check_elf.py app/build/app/outputs/flutter-apk/app-fdroid-release.apk
      - name: Preview APK (throwaway CI key, for device checks only)
        run: |
          # Not a release: signed with a key generated per run, so it installs on a phone but
          # cannot update (or be updated by) a real release — uninstall first.
          mkdir -p preview && cp app/build/app/outputs/flutter-apk/app-fdroid-release.apk preview/unsigned.apk
          docker run --rm -v "$PWD/preview:/p" refocal-rebuilder:ci bash -euc '
            keytool -genkeypair -keystore /tmp/ci.jks -storepass preview -keypass preview -alias ci \
              -keyalg RSA -keysize 2048 -validity 30 -dname CN=refocal-ci-preview >/dev/null 2>&1
            apksigner sign --ks /tmp/ci.jks --ks-pass pass:preview --alignment-preserved \
              --out /p/refocal-preview-${{ github.sha }}.apk /p/unsigned.apk'
          rm preview/unsigned.apk preview/*.idsig 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-preview
          path: preview/*.apk
          retention-days: 14

  # The one required check of main (branch ruleset): green only when every job above passed or
  # was skipped by "changes". Jobs can be added or renamed without touching the ruleset.
  ci-ok:
    if: always()
    needs: [changes, scripts, dart, native, fuzz, android]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended: $r"; exit 1 ;; esac
          done
