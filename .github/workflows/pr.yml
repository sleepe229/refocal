# PR gate (docs/spec/11-ci-cd-release.md §1, OPS-CI-001). M0 skeleton scope:
# Dart format/analyze/tests, ABI header sync, native tests with sanitizers (incl. TSan with a
# self-check), Android APK builds (play, fdroid) in the same pinned image as the S8 rebuilder.
# TODO(0.1): clang-format/clang-tidy, fuzzing, refocal-cli golden, license check, size gate,
# iOS build without signing (needs enh.xcframework, see packages/refocal_ffi/ios).
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter SDK (pinned submodule, full history for versioning)
        id: flutter
        run: echo "sha=$(git rev-parse HEAD:flutter)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            flutter
            ~/.pub-cache
          key: flutter-${{ steps.flutter.outputs.sha }}-${{ hashFiles('pubspec.lock') }}
      - run: |
          git submodule update --init flutter
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --suppress-analytics config --no-analytics && flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed app packages
      - name: Analyze
        run: flutter analyze app packages
      - name: enh.h in sync with the spec appendix
        run: diff -u docs/spec/appendix/enh.h native/include/enh.h
      - name: FFI bindings up to date
        run: |
          sudo apt-get install -y --no-install-recommends libclang-18-dev >/dev/null
          cd packages/refocal_ffi
          LIBCLANG_PATH=/usr/lib/llvm-18/lib dart run ffigen --config ffigen.yaml
          git diff --exit-code -- lib/src/enh_bindings.g.dart
      - name: refocal_core tests
        run: cd packages/refocal_core && dart test
      - name: app widget tests
        run: cd app && flutter test

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["", address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party/ncnn
      - name: TSan self-check (a known race must be reported)
        if: matrix.sanitize == 'thread'
        run: |
          # S6: on some kernels (high-entropy ASLR) TSan re-execs and silently reports nothing.
          printf '#include <thread>\nint x;int main(){std::thread t([]{x++;});x++;t.join();}\n' > race.cpp
          clang++-18 -fsanitize=thread -g race.cpp -o race
          if ./race; then echo "::error::TSan does not detect races on this runner"; exit 1; fi
      - name: Configure
        run: >
          CC=clang-18 CXX=clang++-18 cmake -S native -B native/build-ci -G "Unix Makefiles"
          -DENH_BUILD_TESTS=ON -DENH_SANITIZE=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build native/build-ci -j"$(nproc)"
      - run: ctest --test-dir native/build-ci --output-on-failure
      - name: S6 event-bridge stress
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S spikes/s6-ffi/native -B spikes/s6-ffi/native/build-ci \
            -DSANITIZE=${{ matrix.sanitize }} -DDART_SDK_INCLUDE=/nonexistent >/dev/null
          cmake --build spikes/s6-ffi/native/build-ci -j"$(nproc)"
          spikes/s6-ffi/native/build-ci/stress 1000

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/rebuilder
          tags: refocal-rebuilder:ci
          load: true
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build APKs (fdroid, play)
        run: |
          chmod -R a+rwX .
          for flavor in fdroid play; do
            docker run --rm -v "$PWD:/src" -w /src/app refocal-rebuilder:ci bash -euc "
              export PATH=/src/flutter/bin:\$PATH
              git config --global --add safe.directory '*'
              flutter --suppress-analytics config --no-analytics >/dev/null
              flutter --suppress-analytics build apk --release --flavor $flavor --target-platform android-arm64"
          done
          ls -l app/build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
