# PR gate (docs/spec/11-ci-cd-release.md §1, OPS-CI-001). M0 skeleton scope:
# Dart format/analyze/tests, ABI header sync, native tests with sanitizers (incl. TSan with a
# self-check), Android APK builds (play, fdroid) in the same pinned image as the S8 rebuilder.
# Native: test_abi, test_pipeline, test_job (end-to-end job ABI on synthetic ncnn models:
# exact nearest x4, tiled == whole, cancel, pause/resume, NEEDS_USER, fallback ladder, PNG
# input, export metadata), test_codecs (PNG/WebP, metaio EXIF rewrite + mutation fuzz).
# TODO(0.1): clang-format/clang-tidy, fuzzing, refocal-cli golden on the real compact model
# (needs model hosting), license check, size gate,
# iOS build without signing (needs enh.xcframework, see packages/refocal_ffi/ios).
name: pr

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed: native jobs (3 ncnn builds) run only when the core can be affected.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "native=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          if echo "$files" | grep -qE '^(native/|spikes/s6-ffi/|tools/refocal-cli/|\.github/workflows/pr\.yml|\.gitmodules)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter SDK (pinned submodule, full history for versioning)
        id: flutter
        run: echo "sha=$(git rev-parse HEAD:flutter)" >> "$GITHUB_OUTPUT"
      # The submodule's git dir and the pub cache are restored before checkout; flutter/ itself
      # is a submodule worktree (its .git points into .git/modules) and must not be cached whole.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .git/modules/flutter
            ~/.pub-cache
          key: flutter-git-${{ steps.flutter.outputs.sha }}-${{ hashFiles('pubspec.lock') }}
      - run: |
          git submodule update --init flutter
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flutter/bin/cache
          key: flutter-bin-${{ steps.flutter.outputs.sha }}
      - run: flutter --suppress-analytics config --no-analytics && flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed app packages
      - name: Analyze
        run: flutter analyze app packages
      - name: enh.h in sync with the spec appendix
        run: diff -u docs/spec/appendix/enh.h native/include/enh.h
      - name: FFI bindings up to date
        run: |
          sudo apt-get install -y --no-install-recommends libclang-18-dev >/dev/null
          cd packages/refocal_ffi
          LIBCLANG_PATH=/usr/lib/llvm-18/lib dart run ffigen --config ffigen.yaml
          git diff --exit-code -- lib/src/enh_bindings.g.dart
      - name: refocal_core tests
        run: cd packages/refocal_core && dart test
      - name: app widget tests
        run: cd app && flutter test

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["", address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive --depth 1 native/third_party
      - name: OpenMP for clang (otherwise ncnn CPU inference is single-threaded), ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-18-dev ccache >/dev/null
          # Experiment (TSan on kernel 6.17): newer clangs from the noble archive, if present.
          for v in 19 20; do
            sudo apt-get install -y --no-install-recommends clang-$v libclang-rt-$v-dev >/dev/null \
              && echo "clang-$v installed" || echo "clang-$v not available"
          done
      - name: ccache key (submodule commits)
        id: subs
        run: echo "sha=$(git submodule status --recursive native/third_party | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.sanitize }}-${{ steps.subs.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.sanitize }}-${{ steps.subs.outputs.sha }}-
            ccache-${{ matrix.sanitize }}-
      - name: TSan self-check (a known race must be reported)
        if: matrix.sanitize == 'thread'
        run: |
          set +e
          uname -r; sudo sysctl -n vm.mmap_rnd_bits
          cat > race.cpp <<'EOF'
          #include <atomic>
          #include <thread>
          int x;
          std::atomic<int> step{0};  // relaxed: no happens-before for TSan
          int main() {
            std::thread t([] {
              x++;
              step.store(1, std::memory_order_relaxed);
              while (step.load(std::memory_order_relaxed) != 2) {}
            });
            while (step.load(std::memory_order_relaxed) != 1) {}
            x++;  // both threads alive, unordered with the write above
            step.store(2, std::memory_order_relaxed);
            t.join();
          }
          EOF
          clang++-18 -fsanitize=thread -g race.cpp -o race
          hits=0
          for n in $(seq 20); do
            timeout 60 ./race >/dev/null 2>race.err
            grep -q 'data race' race.err && hits=$((hits+1))
          done
          echo "deterministic probe: $hits/20 detected"
          exit 1  # experiment: stop before the build
      - name: Configure
        run: >
          CC=clang-18 CXX=clang++-18 cmake -S native -B native/build-ci -G "Unix Makefiles"
          -DENH_BUILD_TESTS=ON -DENH_BUILD_CLI=ON -DENH_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DENH_NCNN_RUNTIME_CPU=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build native/build-ci -j"$(nproc)"
      - run: ctest --test-dir native/build-ci --output-on-failure
      - name: S6 event-bridge stress
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S spikes/s6-ffi/native -B spikes/s6-ffi/native/build-ci \
            -DSANITIZE=${{ matrix.sanitize }} -DDART_SDK_INCLUDE=/nonexistent \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache >/dev/null
          cmake --build spikes/s6-ffi/native/build-ci -j"$(nproc)"
          spikes/s6-ffi/native/build-ci/stress 1000

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --recursive
      - name: Bundled model (optional until the weights release exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/models/fetch.sh || echo "::warning::model not bundled, the APK will report it missing"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/rebuilder
          tags: refocal-rebuilder:ci
          load: true
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-ci
          key: gradle-${{ hashFiles('app/android/**/*.kts', 'packages/*/android/build.gradle*', 'app/android/gradle/wrapper/*') }}
          restore-keys: gradle-
      # ccache for the NDK build of the native core: 491 compilations, warm build ~1 min instead
      # of ~15 (measured on 4 CPUs). Keyed by submodule commits; each run saves a fresh entry.
      - name: ccache key (submodule commits)
        id: subs
        run: echo "sha=$(git submodule status --recursive native/third_party | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache-android
          key: ccache-android-${{ steps.subs.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ steps.subs.outputs.sha }}-
            ccache-android-
      - name: Build APKs (fdroid; play too on main; arm64 only in CI)
        env:
          FLAVORS: ${{ github.event_name == 'push' && 'fdroid play' || 'fdroid' }}
        run: |
          chmod -R a+rwX .
          mkdir -p ~/.gradle-ci ~/.ccache-android && chmod a+rwX ~/.gradle-ci ~/.ccache-android
          for flavor in $FLAVORS; do
            docker run --rm -v "$PWD:/src" \
              -v "$HOME/.gradle-ci:/gradle" -e GRADLE_USER_HOME=/gradle \
              -v "$HOME/.ccache-android:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src \
              -e CCACHE_NOHASHDIR=true -e CCACHE_MAXSIZE=1G \
              -e ORG_GRADLE_PROJECT_refocalAbis=arm64-v8a -e ORG_GRADLE_PROJECT_refocalCcache=ccache \
              -w /src/app refocal-rebuilder:ci bash -euc "
              export PATH=/src/flutter/bin:\$PATH
              git config --global --add safe.directory '*'
              flutter --suppress-analytics config --no-analytics >/dev/null
              flutter --suppress-analytics build apk --release --flavor $flavor --target-platform android-arm64 \
                --split-debug-info=build/symbols
              ccache -s | grep -iE 'hits|misses' | head -2"
          done
          ls -l app/build/app/outputs/flutter-apk/
      - name: Preview APK (throwaway CI key, for device checks only)
        run: |
          # Not a release: signed with a key generated per run, so it installs on a phone but
          # cannot update (or be updated by) a real release — uninstall first.
          mkdir -p preview && cp app/build/app/outputs/flutter-apk/app-fdroid-release.apk preview/unsigned.apk
          docker run --rm -v "$PWD/preview:/p" refocal-rebuilder:ci bash -euc '
            keytool -genkeypair -keystore /tmp/ci.jks -storepass preview -keypass preview -alias ci \
              -keyalg RSA -keysize 2048 -validity 30 -dname CN=refocal-ci-preview >/dev/null 2>&1
            apksigner sign --ks /tmp/ci.jks --ks-pass pass:preview --alignment-preserved \
              --out /p/refocal-preview-${{ github.sha }}.apk /p/unsigned.apk'
          rm preview/unsigned.apk preview/*.idsig 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-preview
          path: preview/*.apk
          retention-days: 14
