name: Bug
description: Something does not work (a crash, an error, a wrong save).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 7, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Refocal version (About)
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Mode, scale, model, backend
      placeholder: 4×, Standard, faces on, GPU (from the result details)
  - type: textarea
    id: error
    attributes:
      label: Error message, if the app showed one
      render: text
